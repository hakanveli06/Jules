<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Todo List">
    <meta name="theme-color" content="#4a90e2">
    <title>Kapsamlı Todo List</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Yapılacaklar Listesi</h1>
            <div class="stats">
                <span id="total-tasks">0</span> Toplam,
                <span id="completed-tasks">0</span> Tamamlandı
            </div>
        </header>

        <div class="input-section">
            <input type="text" id="todo-input" placeholder="Yeni bir görev ekle...">
            <input type="date" id="todo-date" title="Bitiş Tarihi">
            <button id="add-btn"><i class="fas fa-plus"></i> Ekle</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Tümü</button>
            <button class="filter-btn" data-filter="pending">Bekleyenler</button>
            <button class="filter-btn" data-filter="completed">Tamamlananlar</button>
        </div>

        <ul id="todo-list">
            <!-- Todo items will be inserted here by JavaScript -->
        </ul>

        <div class="actions">
            <button id="clear-completed">Tamamlananları Temizle</button>
            <button id="clear-all">Tümünü Temizle</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
